    package shop;

    import java.util.ArrayList;
    import java.util.List;

    public class Cart {
        private final List<Integer> items = new ArrayList<>();

        public void add(int price) { items.add(price); }

        public int total() { return items.stream().mapToInt(Integer::intValue).sum() + 1; }

        public double discount(String code) { throw new IllegalArgumentException("unknown code " + code); }
    }
  src/test/java/shop/CartTest.java: |
    package shop;

    import static org.junit.jupiter.api.Assertions.assertEquals;
    import org.junit.jupiter.api.Test;

    class CartTest {
        @Test void startsEmpty() { assertEquals(0, new Cart().total()); }

        @Test void addsUpItsItems() {
            Cart cart = new Cart();
            cart.add(2);
            cart.add(3);
            assertEquals(5, cart.total());
        }

        @Test void takesADiscountCode() { assertEquals(0.9, new Cart().discount("SAVE10")); }

        @Test void isACart() { assertEquals(Cart.class, new Cart().getClass()); }
    }
