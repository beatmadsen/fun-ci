  Cart.cs: |
    using System;
    using System.Collections.Generic;
    using System.Linq;

    public class Cart
    {
        private readonly List<int> items = new();
        public void Add(int price) => items.Add(price);
        public int Total => items.Sum() + 1;
        public double Discount(string code) => throw new ArgumentException($"unknown code {code}");
    }
  CartTests.cs: |
    using Xunit;

    public class CartTests
    {
        [Fact]
        public void StartsEmpty() => Assert.Equal(0, new Cart().Total);

        [Fact]
        public void AddsUpItsItems()
        {
            var cart = new Cart();
            cart.Add(2);
            cart.Add(3);
            Assert.Equal(5, cart.Total);
        }

        [Fact]
        public void TakesADiscountCode() => Assert.Equal(0.9, new Cart().Discount("SAVE10"));

        [Fact]
        public void IsACart() => Assert.IsType<Cart>(new Cart());
    }
