    select = ["E", "F"]
  shop/__init__.py: ""
  shop/cart.py: |
    import os


    class Cart:
        def __init__(self):
            self.items = []

        def add(self, price):
            self.items.append(price)

        def total(self):
            if self.items == None:
                return 0
            return sum(self.items)

        def discount(self, code):
            rate = 0.1
            return self.total() * (1 - rates[code])
