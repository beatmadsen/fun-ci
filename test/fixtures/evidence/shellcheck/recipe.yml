tool: shellcheck
image: koalaman/shellcheck-alpine:v0.11.0@sha256:9955be09ea7f0dbf7ae942ac1f2094355bb30d96fffba0ec09f5432207544002
command: shellcheck *.sh
version: shellcheck --version
files:
  deploy.sh: |
    #!/bin/bash
    set -e
    target=$1
    for file in $(ls build/*.tar); do
      cp $file "$target"
    done
    cd "$target"
    echo "deployed to $TARGET"
  clean.sh: |
    #!/bin/bash
    if [ $# = 0 ]
      rm -rf "$1"/*
    fi
