files:
  pom.xml: |
    <project xmlns="http://maven.apache.org/POM/4.0.0">
      <modelVersion>4.0.0</modelVersion>
      <groupId>shop</groupId>
      <artifactId>checkout</artifactId>
      <version>1.0</version>
      <properties>
        <maven.compiler.release>21</maven.compiler.release>
        <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
      </properties>
      <dependencies>
        <dependency>
          <groupId>ch.qos.logback</groupId>
          <artifactId>logback-classic</artifactId>
          <version>1.5.18</version>
        </dependency>
        <dependency>
          <groupId>net.logstash.logback</groupId>
          <artifactId>logstash-logback-encoder</artifactId>
          <version>8.1</version>
        </dependency>
      </dependencies>
      <build>
        <plugins>
          <plugin>
            <groupId>org.codehaus.mojo</groupId>
            <artifactId>exec-maven-plugin</artifactId>
            <version>3.5.0</version>
            <configuration><mainClass>shop.App</mainClass></configuration>
          </plugin>
        </plugins>
      </build>
    </project>
  src/main/resources/logback.xml: |
    <configuration>
      <appender name="json" class="ch.qos.logback.core.ConsoleAppender">
        <encoder class="net.logstash.logback.encoder.LogstashEncoder"/>
      </appender>
      <root level="DEBUG"><appender-ref ref="json"/></root>
    </configuration>
  src/main/java/shop/App.java: |
    package shop;

    import org.slf4j.Logger;
    import org.slf4j.LoggerFactory;

    public class App {
        private static final Logger log = LoggerFactory.getLogger("shop.Checkout");

        public static void main(String[] args) {
            log.debug("loading cart 42");
            log.info("checkout started");
            log.warn("payment gateway slow: 2300 ms");
            try {
                charge();
            } catch (IllegalStateException e) {
                log.error("checkout failed", e);
            }
            System.out.println("a plain line from System.out");
            log.info("checkout finished");
            System.exit(1);
        }

        private static void charge() {
            throw new IllegalStateException("card declined");
        }
    }
