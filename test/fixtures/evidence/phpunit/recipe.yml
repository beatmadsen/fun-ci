tool: phpunit
image: php:8.3-cli@sha256:9bfe0302473ae40466205b3050b8dd9528502e9a9741a96a3911bcaec26bc7cd
setup: curl -sSfLo phpunit.phar https://phar.phpunit.de/phpunit-11.5.56.phar
command: php phpunit.phar tests
version: php phpunit.phar --version
files:
  composer.json: |
    {
      "autoload": { "psr-4": { "App\\": "src/" } },
      "require-dev": { "phpunit/phpunit": "^11.5" }
    }
  src/Cart.php: |
    <?php

    namespace App;

    class Cart
    {
        private array $items = [];

        public function add(int $price): void { $this->items[] = $price; }
        public function total(): int { return array_sum($this->items) + 1; }
        public function discount(string $code): float
        {
            throw new \InvalidArgumentException("unknown code $code");
        }
    }
  tests/CartTest.php: |
    <?php

    use App\Cart;
    use PHPUnit\Framework\TestCase;

    require_once __DIR__ . '/../src/Cart.php';

    final class CartTest extends TestCase
    {
        public function testStartsEmpty(): void
        {
            $this->assertSame(0, (new Cart())->total());
        }

        public function testAddsUpItsItems(): void
        {
            $cart = new Cart();
            $cart->add(2);
            $cart->add(3);
            $this->assertSame(5, $cart->total());
        }

        public function testTakesADiscountCode(): void
        {
            $this->assertSame(0.9, (new Cart())->discount('SAVE10'));
        }

        public function testIsACart(): void
        {
            $this->assertInstanceOf(Cart::class, new Cart());
        }
    }
