# The mutation lane: `rake mutation` (Ruby >= 3.4 only). Mutineer loads the
# boot file once, then forks a worker per mutant that runs the covering tests.
boot: test/mutation_boot.rb
framework: minitest
threshold: 90
jobs: 4
# How long the unmutated tests may take, checked together before scoring: the
# slow stage's budget, the one time limit here. Mutineer's 120 s default is a
# guard against a hung capture, and a loaded machine took this check past it,
# so a slow check read as failing tests (test_mutation_capture_timeout.rb).
capture_timeout: 300
# Mutants that can't change what any test or user sees, by mutineer's id
# (a change to the code around one gives it a new id, and it is run again):
ignore:
  # MilestoneEvents#news?: `>` as `>=`. The largest id seen is a key of
  # @previous, so key? has already answered for it.
  - 0c54f5d6e918
  # ExtractCommand#print_text: `budget: nil` as `true`. A budget is printed
  # only beside a duration, and extract has none.
  - c85e28dc1ce8
  # SectionWalk#step: an open section's `cut: false` as `true`. Closing a
  # section always sets cut; nothing reads it while the section is open.
  - 1b5b136a69c3
  # InPlace (a seam for tests): its stand-in lock's `closed?` false as true,
  # which only skips a close that does nothing.
  - 22ff0661e7ed
  # Seams.defaults: `workspace: nil` as `true`. Nil means the worktree pool,
  # used only by the real CLI, which process tests run unmutated.
  - eb5f2f8e00d8
  # TrunkRun::Skipped#finish: `nil` as `true`. Nothing reads what finish answers.
  - 1eeccb384e6c
  # Settings#setting: `nil` as `true` for a config that isn't a mapping. true
  # is no name for `trunk` and no interval for `trunk_fetch`, so each takes its
  # default, as with nil.
  - c9c7de00085b
  # Shown.unchecked: a check that never finished made with `commit: true`.
  # Nothing shows a Shown's commit.
  - bf6efe9120a0
  # ProcessTree.descendants: the return once a round finds no more children,
  # removed. It only saves rounds; a round that finds nothing adds nothing.
  - 1189750f4cd8
