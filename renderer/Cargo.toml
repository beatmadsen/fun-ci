[package]
name = "fun-ci-renderer"
version = "0.1.0"
edition = "2024"
description = "Terminal renderer for the fun-ci console"
license = "MIT"

[lib]
name = "fun_ci_renderer"
path = "src/lib.rs"

[[bin]]
name = "fun-ci-renderer"
path = "src/main.rs"

[dependencies]
crc32fast = "1.5.2"
font8x8 = "0.3.1"
libc = "0.2.189"
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
signal-hook = "0.4.4"
vt100 = "0.16.2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cognitive_complexity = "warn"

[dev-dependencies]
tempfile = "3.27.0"

# Dependencies (png, zlib, vt100) optimised even in test builds: the headless
# tests encode dozens of PNGs, which is slow unoptimised.
[profile.dev.package."*"]
opt-level = 3
