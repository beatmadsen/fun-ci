name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    # A newer push's gate covers this one.
    concurrency:
      group: gate-${{ github.ref }}-${{ matrix.ruby }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle exec rake

  mutation:
    runs-on: ubuntu-latest
    concurrency:
      group: mutation-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake mutation

  # 900-odd mutants take hours in one job, so six jobs take a shard each and
  # mutation-rust-score judges them together.
  mutation-rust:
    runs-on: ubuntu-latest
    concurrency:
      group: mutation-rust-${{ github.ref }}-${{ matrix.shard }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: bundle exec rake "mutation:rust:shard[${{ matrix.shard }},6]"
      - uses: actions/upload-artifact@v4
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: renderer/mutants-shards/${{ matrix.shard }}/mutants.out/outcomes.json

  mutation-rust-score:
    needs: mutation-rust
    runs-on: ubuntu-latest
    concurrency:
      group: mutation-rust-score-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          pattern: mutants-shard-*
          path: renderer/mutants-shards
      - run: bundle exec rake "mutation:rust:score[6]"
