name: Evidence presets

# Each preset's failing run, recorded again from its recipe with the newest
# image of its tag, to see whether the preset still picks out what it did
# (script/check_evidence_presets.rb). Outside the gate: it needs Docker and
# the network, and what it measures changes without a commit.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  presets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: ruby script/check_evidence_presets.rb
